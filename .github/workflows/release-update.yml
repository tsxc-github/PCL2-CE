name: release-update

on:
  workflow_call:
  push:
    branches:
      - empty
jobs: 
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Call
        shell: bash
        run: |
          curl -L \
          -X POST \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer ${{ secrets.TOKEN_PCL2_CE_Server }}" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          https://api.github.com/repos/tsxc-github/PCL2_CE_Server/actions/workflows/build.yml/dispatches \
          -d '{"ref":"script"}'

                